<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>My profile · One-Click Form Filler</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font:15px/1.5 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:20px 16px 80px;color:#1b1b1f;background:#fff}
  fieldset{border:1px solid #d5d7dd;border-radius:10px;margin:0 0 18px;padding:12px 16px 16px}
  legend{font-weight:700;padding:0 6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  label{display:block;font-weight:600;font-size:13px}
  input,textarea{display:block;width:100%;box-sizing:border-box;min-height:44px;padding:8px 10px;margin-top:4px;font:inherit;border:1px solid #6b7080;border-radius:6px}
  textarea{min-height:100px}
  button{min-height:44px;padding:0 18px;font:inherit;font-weight:600;border:0;border-radius:8px;background:#1a56db;color:#fff;cursor:pointer}
  button.sec{background:#fff;color:#1a56db;border:1px solid #1a56db}
  :focus-visible{outline:3px solid #f5a623;outline-offset:2px}
  .rule{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #d5d7dd;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  #msg{font-weight:600;color:#17663a}
</style></head><body>
<h1>My profile</h1>
<p>Everything is saved only in this browser. Leave a field empty to skip it.</p>
<form id="form"></form>
<fieldset><legend>Custom rules</legend>
  <p>Teach it a question: if a field's label contains the text on the left, it gets the value on the right (e.g. <em>work authorization</em> → <em>Yes</em>; for radio buttons the value is the answer's text).</p>
  <div id="rules"></div>
  <button type="button" class="sec" id="addRule">Add rule</button>
</fieldset>
<div class="bar">
  <button type="button" id="save">Save</button>
  <button type="button" class="sec" id="export">Export JSON</button>
  <button type="button" class="sec" id="importBtn">Import JSON</button>
  <input type="file" id="importFile" accept="application/json" hidden>
  <span id="msg" role="status"></span>
</div>
<script src="fields.js"></script><script src="options.js"></script>
</body></html>
