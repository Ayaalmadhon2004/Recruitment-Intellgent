name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # `check` does not build, so a page that fails to prerender (for example a function passed from a server
  # component to a client component) would pass it. This job catches that before the deploy does.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Separate from `check` because it needs a Chromium download and a full Storybook build, which are slow.
  # Not a required check: it reports accessibility violations without blocking merges.
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm build-storybook
      - run: pnpm a11y

  # Fails on high or critical advisories in production dependencies. This is a normal (blocking) job on
  # purpose: a new advisory can turn it red without any code change, so fix or upgrade the dependency.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  # Runs the browser smoke and motion checks against a production build of the app.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm build
      - name: Start the app
        run: |
          pnpm start > app.log 2>&1 &
          npx --yes wait-on@8 http://localhost:3000 --timeout 60000
      - run: pnpm e2e
      - run: pnpm e2e:motion
      - if: failure()
        run: cat app.log
